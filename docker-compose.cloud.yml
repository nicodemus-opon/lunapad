# Production-shaped cloud stack for local Docker and Coolify.
# Local:   docker compose -f docker-compose.cloud.yml up --build
# Coolify: use this file as the Docker Compose source.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lunapad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lunapad}
      POSTGRES_DB: lunapad
    configs:
      - source: init_pgvector
        target: /docker-entrypoint-initdb.d/01-pgvector.sql
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lunapad -d lunapad']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  trino:
    image: trinodb/trino:481
    # Seed the file-based access-control rules OUTSIDE the dynamic catalog scan
    # dir (/etc/trino/access, shared via the trino-access volume). The rules file
    # previously lived at /etc/trino/catalog/lunapad-access-control.json, inside
    # the directory Trino scans for *.properties catalogs (catalog.management=
    # dynamic, catalog.store=file) — every stale lp_*.properties there delays
    # bootstrap, and unreachable JDBC hosts pushed startup past the healthcheck
    # grace period so Compose marked Trino unhealthy and app never started.
    # Migration is handled here: copy the legacy file once, then remove it from
    # the catalog dir. Must mirror docker-compose.yml.
    # The file must stay world-readable (0644): Trino runs as a different UID and
    # fails with "File is not readable" on a 0600 file written by the app's user.
    command:
      - sh
      - -c
      - |
        mkdir -p /etc/trino/catalog /etc/trino/access
        if [ -d /etc/trino/access/lunapad-access-control.json ]; then rm -rf /etc/trino/access/lunapad-access-control.json; fi
        if [ -d /etc/trino/catalog/lunapad-access-control.json ]; then rm -rf /etc/trino/catalog/lunapad-access-control.json; fi
        if [ ! -f /etc/trino/access/lunapad-access-control.json ] && [ -f /etc/trino/catalog/lunapad-access-control.json ]; then cp /etc/trino/catalog/lunapad-access-control.json /etc/trino/access/lunapad-access-control.json || true; fi
        rm -f /etc/trino/catalog/lunapad-access-control.json || true
        [ -f /etc/trino/access/lunapad-access-control.json ] || printf '%s' '{"catalogs":[],"schemas":[],"tables":[],"queries":[]}' > /etc/trino/access/lunapad-access-control.json
        chmod 644 /etc/trino/access/lunapad-access-control.json || true
        echo "--- trino catalog dir ---" && ls -l /etc/trino/catalog || true
        echo "--- trino access dir ---" && ls -l /etc/trino/access || true
        exec /usr/lib/trino/bin/run-trino
    configs:
      - source: trino_config
        target: /etc/trino/config.properties
      - source: trino_access_control
        target: /etc/trino/access-control.properties
    volumes:
      # Same named volume is mounted at /trino-catalog in app — dynamic
      # CREATE CATALOG files written by Trino appear in the app container there.
      # Access-control rules live in the SEPARATE trino-access volume (mounted at
      # /trino-access in app) so the .json never pollutes the catalog scan dir.
      - trino-catalog:/etc/trino/catalog
      - trino-access:/etc/trino/access
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Image-native check (ships with trinodb/trino:481). Stale lp_*.properties
      # pointing at unreachable JDBC hosts can keep Trino in starting:true for
      # minutes — allow a long grace period instead of failing the deploy.
      test: ['CMD-SHELL', '/usr/lib/trino/bin/health-check']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
      start_interval: 5s
    restart: unless-stopped

  storage-init:
    image: ${LUNAPAD_RUNNER_IMAGE:-lunapad-runner}
    build:
      context: .
      target: runner
    pull_policy: build
    command: sh -c "node scripts/storage-init.mjs && touch /tmp/storage-init-ready && tail -f /dev/null"
    environment:
      # External S3 — all file state (projects, worker scratch, shares, Trino
      # files) lives here. No bundled object store; configure via env.
      # S3_FORCE_PATH_STYLE: 'true' for S3-compatibles (MinIO/Garage/R2-path),
      # 'false' for AWS virtual-hosted style.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-lunapad-artifacts}
      # Single-level only: Coolify leaves nested ${A:-${B:-}} uninterpolated,
      # and refuses to delete env rows referenced here — so only reference
      # vars users must actually set. (AWS_* aliases are still honored when
      # present in the container environment.)
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      STORAGE_INIT_SKIP_BUCKET_CREATE: ${STORAGE_INIT_SKIP_BUCKET_CREATE:-}
    healthcheck:
      test: ['CMD-SHELL', 'test -f /tmp/storage-init-ready']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Automatic one-shot migration: runs on every `up`/deploy BEFORE the app,
  # copying legacy local volumes + DB share snapshots into the external bucket.
  # Idempotent (identical size skips, rerun is a no-op) so leaving it in the boot
  # chain is safe. Gate it with MIGRATION_ARGS / MIGRATE_ENABLE:
  #   MIGRATE_ENABLE=0            → skip (app boots without migrating)
  #   MIGRATION_ARGS="--apply --only projects,db-shares" → subset
  # Never deletes source unless MIGRATION_ARGS includes --delete-source.
  migration:
    image: ${LUNAPAD_RUNNER_IMAGE:-lunapad-runner}
    build:
      context: .
      target: runner
    pull_policy: build
    command: sh -c "if [ \"$${MIGRATE_ENABLE:-1}\" = 0 ]; then echo 'migration disabled via MIGRATE_ENABLE=0'; exit 0; fi; node scripts/migrate-to-s3.mjs $${MIGRATION_ARGS:---apply}"
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_healthy
    extra_hosts:
      # Lets the migration reach host-bound endpoints (e.g. a temporary
      # legacy-RustFS container started with --network host during the
      # old-to-new copy) via http://host.docker.internal:9000 on Linux too.
      - 'host.docker.internal:host-gateway'
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-lunapad-artifacts}
      # Single-level only: Coolify leaves nested ${A:-${B:-}} uninterpolated,
      # and refuses to delete env rows referenced here — so only reference
      # vars users must actually set. (AWS_* aliases are still honored when
      # present in the container environment.)
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PROJECTS_PREFIX: ${S3_PROJECTS_PREFIX:-projects/}
      S3_WORKER_SCRATCH_PREFIX: ${S3_WORKER_SCRATCH_PREFIX:-worker-scratch/}
      S3_SHARES_PREFIX: ${S3_SHARES_PREFIX:-shares/}
      S3_TRINO_CATALOG_PREFIX: ${S3_TRINO_CATALOG_PREFIX:-trino-catalog/}
      S3_TRINO_ACCESS_PREFIX: ${S3_TRINO_ACCESS_PREFIX:-trino-access/}
      DATABASE_URL: postgresql://lunapad:${POSTGRES_PASSWORD:-lunapad}@db:5432/lunapad
      MIGRATION_ARGS: ${MIGRATION_ARGS:---apply}
      MIGRATE_ENABLE: ${MIGRATE_ENABLE:-1}
      # Legacy RustFS copy-out: ZERO env needed. Defaults probe
      # http://host.docker.internal:9000 (a temporary legacy-RustFS container
      # serving the old volume with --network host — see .env.cloud.example).
      # Nothing there -> warn-and-skip. Data there -> copied automatically on
      # every boot (idempotent). Strict fail-fast applies ONLY when you
      # explicitly set MIGRATE_SOURCE_RUSTFS_ENDPOINT and it is unreachable.
      MIGRATE_SOURCE_RUSTFS_ENDPOINT: ${MIGRATE_SOURCE_RUSTFS_ENDPOINT:-http://host.docker.internal:9000}
      MIGRATE_SOURCE_RUSTFS_BUCKET: ${MIGRATE_SOURCE_RUSTFS_BUCKET:-lunapad-artifacts}
      # Legacy source credentials resolve in code: explicit flags first, then
      # RUSTFS_* (passed through below), then generated, then defaults — so no
      # compose reference here, keeping those rows deletable in Coolify.
      SERVICE_PASSWORD_64_RUSTFS: ${SERVICE_PASSWORD_64_RUSTFS:-}
      MIGRATE_REQUIRE_RUSTFS: ${MIGRATE_REQUIRE_RUSTFS:-1}
      MIGRATE_RUSTFS_WAIT_MS: ${MIGRATE_RUSTFS_WAIT_MS:-15000}
      MIGRATE_SOURCE_PROJECT: /migrate/project
      MIGRATE_SOURCE_PROJECTS: /migrate/projects
      MIGRATE_SOURCE_TRINO_CATALOG: /migrate/trino-catalog
      MIGRATE_SOURCE_TRINO_ACCESS: /migrate/trino-access
    volumes:
      - cloud-project:/migrate/project:ro
      - cloud-projects:/migrate/projects:ro
      - trino-catalog:/migrate/trino-catalog:ro
      - trino-access:/migrate/trino-access:ro
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_PORT_BIND:-127.0.0.1:8025}:8025'
    restart: unless-stopped

  app:
    image: ${LUNAPAD_RUNNER_IMAGE:-lunapad-runner}
    build:
      context: .
      target: runner
    pull_policy: build
    ports:
      - '${APP_PORT_BIND:-127.0.0.1:3967}:3000'
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
      trino:
        # service_started, not service_healthy: the app itself writes Trino's
        # access-control file and retries Trino over HTTP, so a slow Trino
        # bootstrap must not deadlock the app that unblocks it.
        condition: service_started
      redis:
        condition: service_healthy
      storage-init:
        condition: service_healthy
      migration:
        # Automatic migration runs before the app on every boot. Exit 0 (incl.
        # MIGRATE_ENABLE=0 skip) unblocks the app; migration failure blocks the
        # app fail-fast so no requests serve half-migrated state.
        condition: service_completed_successfully
    environment:
      SERVICE_URL_APP_3000: ${SERVICE_URL_APP_3000:-}
      SERVICE_FQDN_APP_3000: ${SERVICE_FQDN_APP_3000:-}
      # Single-level: publicOrigin() in code falls back to Coolify's
      # SERVICE_URL_* when ORIGIN is empty.
      ORIGIN: ${ORIGIN:-}
      PORT: 3000
      HOST: 0.0.0.0
      DEPLOYMENT_MODE: cloud
      PUBLIC_CLOUD_SIGNUP_ENABLED: ${PUBLIC_CLOUD_SIGNUP_ENABLED:-true}
      DATABASE_URL: postgresql://lunapad:${POSTGRES_PASSWORD:-lunapad}@db:5432/lunapad
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-cloud-auth-secret}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-bHVuYXBhZC1sb2NhbC1kZXYtc2VjcmV0LTMyLWJ5dGU=}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
      CLOUD_DEFAULT_PLAN: ${CLOUD_DEFAULT_PLAN:-starter}
      CLOUD_EXECUTION_ADAPTER: queue
      CLOUD_QUEUE_WORKER_ENABLED: 'true'
      CLOUD_WORKER_TOKEN: ${CLOUD_WORKER_TOKEN:-change-me-cloud-worker-token}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@localhost}
      REDIS_URL: redis://redis:6379
      TRINO_URL: http://trino:8080
      TRINO_CATALOG_DIR: /trino-catalog
      # Rules file lives in the shared trino-access volume (NOT the catalog scan
      # dir) so the .json never pollutes Trino's dynamic catalog loading.
      TRINO_ACCESS_CONTROL_RULES_FILE: /trino-access/lunapad-access-control.json
      OBJECT_STORAGE_PROVIDER: s3
      FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-s3}
      # External S3 (required in cloud): point at AWS S3 or any S3-compatible
      # endpoint (R2/MinIO/Garage). Keys accept AWS_* aliases.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-lunapad-artifacts}
      # Single-level only: Coolify leaves nested ${A:-${B:-}} uninterpolated,
      # and refuses to delete env rows referenced here — so only reference
      # vars users must actually set. (AWS_* aliases are still honored when
      # present in the container environment.)
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PROJECTS_PREFIX: ${S3_PROJECTS_PREFIX:-projects/}
      S3_WORKER_SCRATCH_PREFIX: ${S3_WORKER_SCRATCH_PREFIX:-worker-scratch/}
      S3_SHARES_PREFIX: ${S3_SHARES_PREFIX:-shares/}
      S3_TRINO_CATALOG_PREFIX: ${S3_TRINO_CATALOG_PREFIX:-trino-catalog/}
      S3_TRINO_ACCESS_PREFIX: ${S3_TRINO_ACCESS_PREFIX:-trino-access/}
      FILE_CACHE_DIR: /tmp/s3cache
      SIGNUP_RATE_LIMIT_PER_HOUR: ${SIGNUP_RATE_LIMIT_PER_HOUR:-20}
      PROJECT_FOLDER: /app/project
      PROJECTS_ROOT: /app/projects
      INNGEST_DEV: ${INNGEST_DEV:-1}
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-local}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-local}
      INNGEST_SERVE_ORIGIN: http://app:3000
    volumes:
      - trino-catalog:/trino-catalog
      - trino-access:/trino-access
      - cloud-project:/app/project
      - cloud-projects:/app/projects
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/api/health > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    image: ${LUNAPAD_RUNNER_IMAGE:-lunapad-runner}
    build:
      context: .
      target: runner
    pull_policy: build
    command: node scripts/cloud-worker.mjs
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Single-level: publicOrigin() in code falls back to Coolify's
      # SERVICE_URL_* when ORIGIN is empty.
      ORIGIN: ${ORIGIN:-}
      LUNAPAD_BASE_URL: http://app:3000
      CLOUD_WORKER_TOKEN: ${CLOUD_WORKER_TOKEN:-change-me-cloud-worker-token}
      CLOUD_WORKER_CONCURRENCY: ${CLOUD_WORKER_CONCURRENCY:-2}
      # Worker needs the same external S3 identity for the S3 scratch handoff
      # (worker-scratch/ keys) once FILE_STORAGE_BACKEND=s3 is live.
      OBJECT_STORAGE_PROVIDER: s3
      FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-lunapad-artifacts}
      # Single-level only: Coolify leaves nested ${A:-${B:-}} uninterpolated,
      # and refuses to delete env rows referenced here — so only reference
      # vars users must actually set. (AWS_* aliases are still honored when
      # present in the container environment.)
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_WORKER_SCRATCH_PREFIX: ${S3_WORKER_SCRATCH_PREFIX:-worker-scratch/}
    volumes:
      # Shared with app (/app/projects): the worker writes result.json into
      # .worker-scratch here and the app resolves large finish results from the
      # resultPointer file instead of a multi-MB POST body.
      - cloud-projects:/app/projects
    restart: unless-stopped

  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://app:3000/api/inngest --no-discovery
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  redis-data:
  trino-catalog:
  trino-access:
  cloud-project:
  cloud-projects:

configs:
  init_pgvector:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;
  trino_config:
    content: |
      coordinator=true
      node-scheduler.include-coordinator=true
      discovery.uri=http://localhost:8080
      catalog.management=dynamic
      catalog.store=file
  trino_access_control:
    content: |
      access-control.name=file
      security.config-file=/etc/trino/access/lunapad-access-control.json
      security.refresh-period=5s
